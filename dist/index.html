      <p class="dg-note dg-center" style="margin:0">Watch the squares light up, then tap them in the same order. One wrong tap ends the run. After level 8 the grid grows to 4×4.</p>
    </div>`;
    const wrap = root.querySelector(".g-memory"), gridEl = root.querySelector(".g-memory-grid"), msg = root.querySelector(".g-memory-msg"), dots = root.querySelector(".g-memory-dots");
    let cellEls = [];
    const KEYS3 = ["1", "2", "3", "4", "5", "6", "7", "8", "9"], KEYS4 = ["1", "2", "3", "4", "q", "w", "e", "r", "a", "s", "d", "f", "z", "x", "c", "v"];
    const KEYS3B = ["q", "w", "e", "a", "s", "d", "z", "x", "c"];
    function build(g) {
      grid = g;
      gridEl.style.setProperty("--g", g);
      const keys = g === 3 ? KEYS3 : KEYS4;
      let h = "";
      for (let i = 0; i < g * g; i++) h += `<button class="g-memory-cell" data-i="${i}" data-test="cell-${i}" aria-label="Square ${i + 1}" disabled><small>${keys[i].toUpperCase()}</small></button>`;
      gridEl.innerHTML = h;
      cellEls = [...gridEl.children];
    }
    const seqCells = () => SEQ.slice(0, memLen(level)).map(([r, c]) => r * grid + c);
    function setMsg(t, go) { msg.textContent = t; msg.classList.toggle("go", !!go); }
    function paintDots() {
      const len = memLen(level);
      let h = "";
      for (let k = 0; k < len; k++) h += `<i class="${k < idx ? "on" : ""}"></i>`;
      dots.innerHTML = h;
    }
    function hudUpdate() {
      setHud(root, "level", String(level || 1)); setHud(root, "long", String(longest)); setHud(root, "score", U.fmt(score));
    }
    function setInput(on) { cellEls.forEach((b) => (b.disabled = !on)); wrap.classList.toggle("input", on); }
    function startLevel() {
      if (done) return;
      level++; idx = 0;
      const g = memGrid(level);
      if (g !== grid) build(g);
      phase = "show"; setInput(false);
      setMsg("Level " + level + " · watch");
      paintDots(); hudUpdate(); status();
      const cells = seqCells(), step = MEM_STEP[mode] * 1000, on = MEM_ON[mode] * 1000;
      cells.forEach((ci, k) => {
        ctx.timeout(() => { cellEls[ci].classList.add("lit"); }, 250 + k * step);
        ctx.timeout(() => { cellEls[ci].classList.remove("lit"); }, 250 + k * step + on);
      });
      ctx.timeout(() => {
        phase = "input"; idx = 0; inputStart = ctx.now();
        setInput(true); setMsg("Your turn", true); paintDots();
      }, 250 + (cells.length - 1) * step + on + 120);
    }
    function tap(ci) {
      if (done || phase !== "input" || ci < 0 || ci >= grid * grid) return;
      const cells = seqCells(), want = cells[idx], el = cellEls[ci];
      if (ci === want) {
        el.classList.remove("tap"); void el.offsetWidth; el.classList.add("tap");
        ctx.timeout(() => el.classList.remove("tap"), 180);
        idx++; paintDots();
        if (idx === cells.length) {
          const len = cells.length, avg = (ctx.now() - inputStart) / 1000 / len;
          longest = len; bonus += memBonus(len, avg);
          score = 100 * longest + bonus;
          ctx.progress(score); hudUpdate();
          phase = "pause"; setInput(false); setMsg("Level " + level + " cleared", true);
          ctx.timeout(startLevel, 700);
        }
      } else {
        phase = "over"; setInput(false);
        el.classList.add("bad"); cellEls[want].classList.add("want");
        setMsg("Wrong square");
        finish("mistake");
      }
    }
    function status() {
      const left = Math.max(0, CAP - ctx.now());
      setHud(root, "time", clock(left / 1000));
      ctx.setStatus("Level " + Math.max(1, level) + " · " + clock(left / 1000) + (phase === "input" ? " · your turn" : phase === "show" ? " · watch" : ""));
    }
    function finish(why) {
      if (done) return;
      done = true;
      ctx.progress(score);
      const detail = detailBox([`<b>${why === "mistake" ? "Missed on level " + level : "Time cap reached on level " + level}</b> · longest sequence ${longest}`,
        `${longest} × 100 + ${bonus} speed bonus = <b class="dg-gold">${U.fmt(score)}</b>`]);
      ctx.setStatus(why === "mistake" ? "Wrong square" : "Time up");
      const endIt = () => ctx.end({ score, detail });
      if (why === "mistake") ctx.timeout(endIt, ctx.reducedMotion ? 200 : 1000); else endIt();
    }
    gridEl.addEventListener("pointerdown", (e) => {
      const b = e.target.closest("[data-i]");
      if (!b || b.disabled) return;
      e.preventDefault(); tap(+b.dataset.i);
    });
    onKey((e) => {
      if (done || phase !== "input") return;
      const k = e.key.toLowerCase();
      let i = (grid === 3 ? KEYS3 : KEYS4).indexOf(k);
      if (i < 0 && grid === 3) i = KEYS3B.indexOf(k);
      if (i >= 0) { e.preventDefault(); tap(i); }
    });
    ctx.interval(() => { if (done) return; status(); if (ctx.now() >= CAP) finish("time"); }, 250);
    build(3); hudUpdate(); status(); ctx.progress(0);
    ctx.timeout(startLevel, 900);
    ctx.test = {
      sequence: () => (level ? seqCells() : []),
      tap,
      state: () => ({ level, grid, phase, idx, longest, bonus, score, done }),
      solution: () => (level ? seqCells() : []),
      solve() { if (phase !== "input") return false; const s = seqCells(); for (let k = idx; k < s.length; k++) tap(s[k]); return true; },
      mistake() { if (phase !== "input") return false; const s = seqCells(); tap((s[idx] + 1) % (grid * grid)); return true; },
    };
  }

  DG.registerGame({
    id: "memory", name: "Memory Duel", category: "puzzle", kind: "race", formats: FORMATS,
    skill: 9, luck: 0, cashEligible: true, duration: "1–4 min", pack: "brain", scoreLabel: "points",
    blurb: "Watch the squares flash, repeat the order. The sequence grows by one every level.",
    rules: [
      "Squares light up in order. Tap them back in the same order.",
      "Every level adds one more step. After level 8 the grid grows from 3×3 to 4×4.",
      "One wrong tap ends your run.",
      "Score: 100 × your longest sequence + a speed bonus for quick, correct input.",
      "Everyone gets the same sequence. Cap: 4 min (Duel Mix: 45 s).",
    ],
    play: playMemory,
    bot: memBot,
    lab: {
      sequence: (seed, n) => memSeq(seed).slice(0, n || 20),
      human: (seed, mode) => { const r = memSim(seed, mode, { levels: 11, tap: 0.45 }, null); return { score: r.score, longest: r.longest }; },
    },
  });
})();

</script>
<script>/* games/reflex.js */
/* Duel.gold — Pack C: REFLEX & PRECISION
   Games: reaction (Reaction Duel), aim (Aim Duel), rush (Number Rush), darts (Darts Nine), hockey (Air Hockey).
   All content comes from the match seed; bots replay the same seeded content with skill-scaled behaviour. */
(function () {
  "use strict";
  const U = DG.util;
  const ALL = ["1v1", "2v2", "ffa", "tournament", "mix"];
  const clamp = U.clamp;
  const r2 = (n) => Math.round(n * 100) / 100;
  const TAU = Math.PI * 2;

  /* ---------- shared helpers ---------- */
  function tokens(el) {
    const cs = getComputedStyle(el);
    const v = (n, d) => (cs.getPropertyValue(n) || "").trim() || d;
    return {
      ink: v("--ink", "#10111F"), panel: v("--panel", "#181A2E"), panel2: v("--panel-2", "#212440"),
      panel3: v("--panel-3", "#2A2E52"), line: v("--line", "#30345A"), fg: v("--fg", "#EEEAF7"),
      muted: v("--muted", "#9D9BC0"), gold: v("--gold", "#F2C14E"), goldDeep: v("--gold-deep", "#B9892B"),
      onGold: v("--on-gold", "#1A1406"), rival: v("--rival", "#FF6275"), ally: v("--ally", "#6FC3FF"),
      good: v("--good", "#5AD690"), bad: v("--bad", "#FF6275"), warn: v("--warn", "#FFB35C"),
      mono: v("--f-mono", "monospace"), display: v("--f-display", "sans-serif"), body: v("--f-body", "sans-serif"),
    };
  }
  function statusSetter(ctx) {
    let last = null;
    return (t) => { if (t !== last) { last = t; ctx.setStatus(t); } };
  }
  function mmss(sec) {
    sec = Math.max(0, Math.ceil(sec));
    return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
  }
  function finishTimeline(tl, score, endT) {
    const out = [];
    let lastT = 0;
    for (const [t, s] of tl) { const tt = Math.max(lastT, r2(t)); out.push([tt, s]); lastT = tt; }
    if (!out.length || out[out.length - 1][1] !== score || (endT != null && endT > lastT)) out.push([Math.max(lastT, r2(endT != null ? endT : lastT)), score]);
    return out;
  }

  /* Canvas sized to its host width, DPR-aware, re-laid-out on host resize (observer self-disconnects on end). */
  function canvasView(ctx, host, layout) {
    const cv = document.createElement("canvas");
    cv.style.cssText = "display:block;touch-action:none;max-width:100%;margin:0 auto;user-select:none;-webkit-user-select:none";
    host.style.minWidth = "0";
    host.appendChild(cv);
    const g = cv.getContext("2d");
    const view = { cv, g, lw: 1, lh: 1, scale: 1, dpr: 1, cssW: 1, cssH: 1, meta: {}, onFit: null };
    let lastW = -1;
    function fit() {
      const cw = Math.max(240, Math.min(860, host.clientWidth || 320));
      lastW = host.clientWidth;
      const L = layout(cw);
      const dpr = Math.min(3, window.devicePixelRatio || 1);
      Object.assign(view, { lw: L.lw, lh: L.lh, cssW: L.cssW, cssH: L.cssH, scale: L.cssW / L.lw, dpr, meta: L });
      cv.style.width = L.cssW + "px"; cv.style.height = L.cssH + "px";
      cv.width = Math.round(L.cssW * dpr); cv.height = Math.round(L.cssH * dpr);
      layer = null;
      view.reset();
      if (view.onFit) view.onFit();
    }
    view.reset = () => g.setTransform(view.dpr * view.scale, 0, 0, view.dpr * view.scale, 0, 0);
    /* cached static layer (board / table): drawn once per size, blitted each frame */
    let layer = null, layerFn = null;
    view.layer = (fn) => {
      if (layer && layerFn === fn) return layer;
      layerFn = fn;
      layer = document.createElement("canvas");
      layer.width = cv.width; layer.height = cv.height;
      const lg = layer.getContext("2d");
      lg.setTransform(view.dpr * view.scale, 0, 0, view.dpr * view.scale, 0, 0);
      fn(lg);
      return layer;
    };
    view.blit = (fn) => { const l = view.layer(fn); g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(l, 0, 0); view.reset(); };
    view.toLogical = (e) => {
      const r = cv.getBoundingClientRect();
      return { x: (e.clientX - r.left) / r.width * view.lw, y: (e.clientY - r.top) / r.height * view.lh };
    };
    view.toClient = (lx, ly) => {
      const r = cv.getBoundingClientRect();
      return { x: r.left + lx / view.lw * r.width, y: r.top + ly / view.lh * r.height };
    };
    let ro = null;
    if (typeof ResizeObserver === "function") {
      let pending = false;
      ro = new ResizeObserver(() => {
        if (ctx.signal.ended) { ro.disconnect(); return; }
        if (pending || Math.abs(host.clientWidth - lastW) <= 0.5) return;
        pending = true; // refit next frame (avoids ResizeObserver loop warnings)
        ctx.raf(() => { pending = false; if (Math.abs(host.clientWidth - lastW) > 0.5) fit(); });
      });
      ro.observe(host);
    }
    view.stop = () => { if (ro) { ro.disconnect(); ro = null; } layer = null; };
    if (typeof ctx.onCleanup === "function") ctx.onCleanup(view.stop);
    fit();
    return view;
  }

  /* =====================================================================
     1. REACTION DUEL
     ===================================================================== */
  function reactionContent(seed, mode) {
    const rng = U.rng(seed + "|reaction");
    const n = mode === "mix" ? 3 : 5;
    const delays = [];
    for (let i = 0; i < n; i++) delays.push(Math.round(1200 + rng() * 2600));
    return { n, delays };
  }

  DG.css("reaction", `
    .g-reaction{display:grid;gap:12px}
    .g-reaction-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
    .g-reaction-head b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
    .g-reaction-pad{width:100%;min-height:clamp(200px,42vh,300px);border-radius:var(--r-lg);border:2px solid var(--line);
      background:var(--panel-2);color:var(--fg);display:grid;place-content:center;gap:8px;text-align:center;padding:16px;
      touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;transition:background .08s}
    .g-reaction-pad .g-reaction-big{font-family:var(--f-display);font-weight:900;text-transform:uppercase;line-height:1;font-size:clamp(40px,10vw,72px);letter-spacing:.01em}
    .g-reaction-pad .g-reaction-sub{font-size:14px;color:var(--muted)}
    .g-reaction-pad[data-state=idle]{border-color:var(--gold-deep)}
    .g-reaction-pad[data-state=wait]{background:color-mix(in srgb,var(--rival) 16%,var(--panel));border-color:color-mix(in srgb,var(--rival) 50%,var(--line))}
    .g-reaction-pad[data-state=go]{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
    .g-reaction-pad[data-state=go] .g-reaction-sub{color:var(--on-gold)}
    .g-reaction-pad[data-state=foul] .g-reaction-big{color:var(--bad)}
    .g-reaction-pad[data-state=result] .g-reaction-big{color:var(--gold)}
    .g-reaction-table td.g-reaction-pts{color:var(--gold)}
    .g-reaction-table tr.g-reaction-cur td{background:var(--panel-2)}`);

  DG.registerGame({
    id: "reaction", name: "Reaction Duel", category: "reflex", kind: "race", formats: ALL,
    skill: 7, luck: 2, cashEligible: true, duration: "30 s", pack: "reflex",
    blurb: "Wait for gold, then tap faster than your rival. Jump early and the round is lost.",
    rules: [
      "Tap the pad (or press Space) to arm a round.",
      "Wait. When the pad turns gold, tap as fast as you can.",
      "Round score is 1000 minus your reaction time in ms (250 ms scores 750).",
      "Tapping before gold is a foul and scores 0. No tap within 1 s also scores 0.",
      "5 rounds (3 in Duel Mix). Highest total wins; everyone gets the same delays.",
    ],
    scoreLabel: "pts",
    play(ctx) {
      const C = reactionContent(ctx.seed, ctx.mode);
      const res = [], log = [];
      let round = 0, phase = "idle", goAt = 0, armAt = 0, timer = null, total = 0;
      const status = statusSetter(ctx);
      ctx.root.innerHTML = `<div class="g-reaction">
        <div class="g-reaction-head"><span class="dg-eyebrow">Round <b data-test="round">1</b> / ${C.n}</span>
          <span class="dg-muted">Total <b class="dg-gold" data-test="score">0</b></span></div>
        <button type="button" class="g-reaction-pad" data-test="pad" data-state="idle">
          <span class="g-reaction-big">Tap to start</span><span class="g-reaction-sub"></span></button>
        <table class="dg-table g-reaction-table"><thead><tr><th>Round</th><th class="num">Time</th><th class="num">Points</th></tr></thead>
          <tbody>${C.delays.map((_, i) => `<tr data-row="${i}"><td>${i + 1}</td><td class="num">—</td><td class="num g-reaction-pts">—</td></tr>`).join("")}</tbody></table>
      </div>`;
      const $ = (s) => ctx.root.querySelector(s);
      const pad = $("[data-test=pad]"), big = pad.querySelector(".g-reaction-big"), sub = pad.querySelector(".g-reaction-sub");
      const setPad = (st, b, s) => { pad.dataset.state = st; big.textContent = b; sub.textContent = s; };
      const clear = () => { if (timer != null) { ctx.clearTimeout(timer); timer = null; } };
      const markRow = () => ctx.root.querySelectorAll("tr[data-row]").forEach((tr) => tr.classList.toggle("g-reaction-cur", +tr.dataset.row === round));

      function idle() {
        phase = "idle";
        $("[data-test=round]").textContent = round + 1;
        markRow();
        setPad("idle", round === 0 ? "Tap to start" : "Next round", "Tap the pad or press Space, then wait for gold.");
        status(`Round ${round + 1}/${C.n}`);
        clear(); timer = ctx.timeout(arm, 6000); // never stall: auto-arm
      }
      function arm() {
        clear(); phase = "wait"; armAt = ctx.now();
        setPad("wait", "Wait…", "Tap only when the pad turns gold.");
        status(`Round ${round + 1}/${C.n} · wait`);
        timer = ctx.timeout(go, C.delays[round]);
      }
      function go() {
        timer = null; phase = "go"; goAt = ctx.now(); log.push({ round, armAt, goAt, wait: goAt - armAt });
        setPad("go", "Tap!", "Now!");
        status(`Round ${round + 1}/${C.n} · TAP`);
        timer = ctx.timeout(() => finishRound({ slow: true }), 1000);
      }
      function finishRound(r) {
        clear();
        let pts = 0, ms = null, label;
        if (r.foul) label = "Foul";
        else if (r.slow) label = "No tap";
        else { ms = Math.max(0, Math.round(r.ms)); pts = Math.max(0, 1000 - ms); label = ms + " ms"; }
        res.push({ ms, foul: !!r.foul, slow: !!r.slow, pts });
        total += pts;
        ctx.progress(total);
        $("[data-test=score]").textContent = U.fmt(total);
        const tr = ctx.root.querySelector(`tr[data-row="${round}"]`);
        tr.children[1].textContent = label; tr.children[2].textContent = pts;
        if (!ms) tr.children[1].className = "num dg-bad";
        phase = "result";
        if (r.foul) setPad("foul", "Foul", "You tapped before gold. 0 points.");
        else if (r.slow) setPad("foul", "Too slow", "No tap within 1 second. 0 points.");
        else setPad("result", ms + " ms", `+${pts} points`);
        round++;
        timer = ctx.timeout(round >= C.n ? done : idle, 1200);
      }
      function done() {
        phase = "over"; timer = null;
        const ok = res.filter((r) => r.ms != null);
        const best = ok.length ? Math.min(...ok.map((r) => r.ms)) : null;
        const avg = ok.length ? Math.round(ok.reduce((a, r) => a + r.ms, 0) / ok.length) : null;
        const fouls = res.filter((r) => r.foul).length;
        const rows = res.map((r, i) => `<tr><td>${i + 1}</td><td class="num">${r.foul ? '<span class="dg-bad">Foul</span>' : r.slow ? '<span class="dg-bad">No tap</span>' : r.ms + " ms"}</td><td class="num dg-gold">${r.pts}</td></tr>`).join("");
        ctx.end({
          score: total,
          detail: `<table class="dg-table"><thead><tr><th>Round</th><th class="num">Time</th><th class="num">Points</th></tr></thead><tbody>${rows}</tbody></table>
            <p class="dg-note">${best != null ? `Best <b class="dg-gold">${best} ms</b> · average ${avg} ms` : "No clean reactions"} · ${fouls} foul${fouls === 1 ? "" : "s"}</p>`,
        });
      }
      function press() {
        if (ctx.signal.ended) return;
        if (phase === "idle") arm();
        else if (phase === "wait") finishRound({ foul: true });
        else if (phase === "go") finishRound({ ms: ctx.now() - goAt });
      }
      pad.addEventListener("pointerdown", (e) => { e.preventDefault(); press(); });
      ctx.onKey((e) => {
        if (e.key === " " || e.key === "Enter" || e.code === "Space") { e.preventDefault(); if (!e.repeat) press(); }
      });
      ctx.test = {
        state: () => ({ round, phase, total, n: C.n, results: res.slice(), delays: C.delays.slice(), log: log.slice() }),
        fire(ms) { if (phase === "idle" || phase === "wait" || phase === "go") { finishRound(ms < 0 ? { foul: true } : { ms }); return true; } return false; },
        press,
      };
      idle();
    },
    bot(seed, skill, rng, mode) {
      const C = reactionContent(seed, mode);
      let t = 0, score = 0;
      const tl = [];
      const mean = 420 - 200 * skill, sd = 45 - 20 * skill, foulP = 0.12 - 0.1 * skill;
      for (let i = 0; i < C.n; i++) {
        t += 0.35 + rng() * 0.6; // time to arm
        if (rng() < foulP) { t += (C.delays[i] / 1000) * (0.3 + rng() * 0.6); }
        else {
          const ms = clamp(mean + sd * U.gauss(rng), 130, 1000);
          t += C.delays[i] / 1000 + ms / 1000;
          score += Math.max(0, 1000 - Math.round(ms));
        }
        tl.push([t, score]);
        t += 1.2;
      }
      return { score, timeline: finishTimeline(tl, score) };
    },
  });

  /* =====================================================================
     2. AIM DUEL
     ===================================================================== */
  const AIM_LIFE = 1100;
  function aimContent(seed, mode) {
    const rng = U.rng(seed + "|aim");
    const dur = mode === "mix" ? 20000 : 30000;
    const T = [];
    let t = 900;
    while (t < dur - 350) {
      const p = t / dur;
      let x, y, tries = 0;
      do { // keep consecutive targets apart
        x = 0.08 + rng() * 0.84; y = 0.1 + rng() * 0.8; tries++;
      } while (tries < 12 && T.slice(-2).some((o) => Math.hypot(o.x - x, o.y - y) < 0.22));
      const r = 0.085 - 0.03 * p + (rng() - 0.5) * 0.02; // radius as fraction of the short side
      T.push({ i: T.length, t: Math.round(t), x, y, r });
      t += 820 - 360 * p + (rng() - 0.5) * 260;
    }
    return { dur, targets: T, life: AIM_LIFE };
  }
  const aimPts = (age) => 100 + Math.round(100 * clamp(1 - age / AIM_LIFE, 0, 1));

  DG.css("aim", `
    .g-aim{display:grid;gap:10px}
    .g-aim-hud{display:flex;gap:16px;flex-wrap:wrap;align-items:baseline}
    .g-aim-hud b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:18px}
    .g-aim-stage{border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);background:var(--panel);line-height:0}
    .g-aim-stage canvas{cursor:crosshair}`);

  DG.registerGame({
    id: "aim", name: "Aim Duel", category: "reflex", kind: "race", formats: ALL,
    skill: 8, luck: 1, cashEligible: true, duration: "30 s", pack: "reflex",
    blurb: "Targets pop up and shrink. Click them fast; stray clicks cost you.",
    rules: [
      "Click or tap each target before it shrinks away (1.1 s).",
      "A hit scores 100 plus up to 100 speed bonus.",
      "A click that hits nothing costs 25.",
      "30 seconds (20 in Duel Mix). Everyone gets the same targets at the same times.",
    ],
    scoreLabel: "pts",
    play(ctx) {
      const C = aimContent(ctx.seed, ctx.mode);
      const T = C.targets.map((o) => Object.assign({ hit: false, hitAt: 0 }, o));
      let score = 0, hits = 0, misses = 0, hitMs = 0, frames = 0, done = false;
      const pops = [];
      const status = statusSetter(ctx);
      ctx.root.innerHTML = `<div class="g-aim">
        <div class="g-aim-hud"><span class="dg-muted">Score <b class="dg-gold" data-test="score">0</b></span>
          <span class="dg-muted">Hits <b data-test="hits">0</b></span><span class="dg-muted">Misses <b data-test="misses">0</b></span></div>
        <div class="g-aim-stage" data-test="stage"></div>
        <p class="dg-note">Hit targets before they vanish. Faster hits score more; missed clicks cost 25.</p></div>`;
      const stage = ctx.root.querySelector("[data-test=stage]");
      const K = tokens(ctx.root);
      const view = canvasView(ctx, stage, (cw) => {
        const hMax = Math.max(260, (window.innerHeight || 800) - 200);
        const h = Math.min(hMax, Math.round(cw < 560 ? cw * 0.95 : cw * 0.58));
        return { lw: cw, lh: h, cssW: cw, cssH: h };
      });
      view.cv.dataset.test = "canvas";
      const t0 = ctx.now();
      const minSide = () => Math.min(view.lw, view.lh);
      const radius = (tg, t) => tg.r * minSide() * (1 - 0.55 * clamp((t - tg.t) / C.life, 0, 1));
      const alive = (tg, t) => !tg.hit && t >= tg.t && t < tg.t + C.life;
      const hud = () => {
        ctx.root.querySelector("[data-test=score]").textContent = U.fmt(score);
        ctx.root.querySelector("[data-test=hits]").textContent = hits;
        ctx.root.querySelector("[data-test=misses]").textContent = misses;
      };
      function hit(tg, t) {
        const age = t - tg.t, pts = aimPts(age);
        tg.hit = true; tg.hitAt = t; score += pts; hits++; hitMs += age;
        pops.push({ x: tg.x, y: tg.y, t, text: "+" + pts, good: true });
        hud(); ctx.progress(score);
      }
      function miss(nx, ny, t) {
        misses++; score = Math.max(0, score - 25);
        pops.push({ x: nx, y: ny, t, text: "−25", good: false });
        hud(); ctx.progress(score);
      }
      view.cv.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        if (ctx.signal.ended || done) return;
        const t = ctx.now() - t0, p = view.toLogical(e);
        let best = null, bd = Infinity;
        const tol = e.pointerType === "touch" ? 10 : 4;
        for (const tg of T) {
          if (!alive(tg, t)) continue;
          const d = Math.hypot(tg.x * view.lw - p.x, tg.y * view.lh - p.y);
          if (d <= radius(tg, t) + tol && d < bd) { bd = d; best = tg; }
        }
        if (best) hit(best, t); else miss(p.x / view.lw, p.y / view.lh, t);
      });
      function draw(t) {
        const g = view.g, W = view.lw, H = view.lh;
        view.reset();
        g.fillStyle = K.panel; g.fillRect(0, 0, W, H);
        g.strokeStyle = K.line; g.lineWidth = 1; g.globalAlpha = 0.5;
        const step = 40;
        g.beginPath();
        for (let x = step; x < W; x += step) { g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, H); }
        for (let y = step; y < H; y += step) { g.moveTo(0, y + 0.5); g.lineTo(W, y + 0.5); }
        g.stroke(); g.globalAlpha = 1;
        if (t < T[0].t - 100) {
          g.fillStyle = K.muted; g.textAlign = "center"; g.textBaseline = "middle";
          g.font = `800 ${Math.round(Math.min(34, W / 12))}px ${K.display}`;
          g.fillText("TARGETS INCOMING", W / 2, H / 2);
        }
        for (const tg of T) {
          if (done || !alive(tg, t)) continue;
          const cx = tg.x * W, cy = tg.y * H, r = radius(tg, t), life = 1 - (t - tg.t) / C.life;
          g.fillStyle = K.panel3; g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.fill();
          g.strokeStyle = K.fg; g.lineWidth = Math.max(2, r * 0.12); g.beginPath(); g.arc(cx, cy, r * 0.7, 0, TAU); g.stroke();
          g.fillStyle = K.gold; g.beginPath(); g.arc(cx, cy, r * 0.32, 0, TAU); g.fill();
          g.strokeStyle = K.gold; g.lineWidth = 3; g.beginPath(); g.arc(cx, cy, r + 5, -Math.PI / 2, -Math.PI / 2 + TAU * life); g.stroke();
        }
        g.textAlign = "center"; g.textBaseline = "middle";
        for (let i = pops.length - 1; i >= 0; i--) {
          const p = pops[i], a = (t - p.t) / 650;
          if (a >= 1) { pops.splice(i, 1); continue; }
          g.globalAlpha = 1 - a; g.fillStyle = p.good ? K.gold : K.bad;
          g.font = `700 18px ${K.mono}`; g.fillText(p.text, p.x * W, p.y * H - 10 - a * 24);
        }
        g.globalAlpha = 1;
        if (done) {
          g.fillStyle = K.gold; g.textAlign = "center"; g.textBaseline = "middle";
          g.font = `900 ${Math.round(Math.min(48, W / 8))}px ${K.display}`;
          g.fillText("TIME", W / 2, H / 2 - 16);
          g.fillStyle = K.fg; g.font = `700 18px ${K.mono}`;
          g.fillText(`${U.fmt(score)} pts · ${hits} hits`, W / 2, H / 2 + 22);
        }
        const left = Math.max(0, C.dur - t);
        g.fillStyle = K.gold; g.fillRect(0, H - 4, W * left / C.dur, 4);
      }
      function finish() {
        done = true; view.stop();
        draw(C.dur);
        const avg = hits ? Math.round(hitMs / hits) : null;
        ctx.end({
          score,
          detail: `<p class="dg-note">Hits <b class="dg-gold">${hits}</b> / ${T.length} · missed clicks <b class="dg-bad">${misses}</b>${avg != null ? ` · average hit ${avg} ms` : ""}</p>`,
        });
      }
      function tick(now) {
        if (done) return;
        frames++;
        const t = now - t0;
        if (t >= C.dur) return finish();
        draw(t);
        status(`${Math.ceil((C.dur - t) / 1000)} s · ${hits} hits`);
        ctx.raf(tick);
      }
      ctx.test = {
        state: () => ({ score, hits, misses, t: ctx.now() - t0, total: T.length, done }),
        alive() {
          const t = ctx.now() - t0;
          return T.filter((tg) => alive(tg, t)).map((tg) => {
            const c = view.toClient(tg.x * view.lw, tg.y * view.lh);
            return { i: tg.i, cx: c.x, cy: c.y, age: t - tg.t, r: radius(tg, t) * view.scale };
          });
        },
        schedule: () => T.map((tg) => ({ i: tg.i, t: tg.t, x: tg.x, y: tg.y, r: tg.r })),
        hitNext() {
          const t = ctx.now() - t0;
          const tg = T.find((o) => alive(o, t));
          if (!tg) return false;
          hit(tg, t); return true;
        },
        frames: () => frames,
      };
      ctx.raf(tick);
    },
    bot(seed, skill, rng, mode) {
      const C = aimContent(seed, mode);
      const pBase = 0.3 + 0.62 * skill, mean = 780 - 420 * skill, sd = 140 - 60 * skill, missRate = 0.25 * (1 - skill);
      const ev = [];
      for (const tg of C.targets) {
        const pHit = clamp(pBase + (tg.r - 0.07) * 4, 0.05, 0.99);
        if (rng() < pHit) {
          const ms = clamp(mean + sd * U.gauss(rng), 200, C.life - 20);
          if (tg.t + ms < C.dur) ev.push([(tg.t + ms) / 1000, aimPts(ms)]);
        }
        if (rng() < missRate) ev.push([(tg.t + 400) / 1000, -25]);
      }
      ev.sort((a, b) => a[0] - b[0]);
      let score = 0;
      const tl = ev.map(([t, d]) => { score = Math.max(0, score + d); return [t, score]; });
      return { score, timeline: finishTimeline(tl, score, C.dur / 1000) };
    },
  });

  /* =====================================================================
     3. NUMBER RUSH
     ===================================================================== */
  function rushProblem(rng, i) {
    const lv = Math.min(1, i / 24);
    const ops = lv < 0.2 ? ["+", "-"] : lv < 0.45 ? ["+", "-", "×"] : ["+", "-", "×", "÷"];
    const op = U.pick(rng, ops);
    let a, b, ans, d;
    if (op === "+") { a = U.randInt(rng, 2 + Math.round(18 * lv), 9 + Math.round(80 * lv)); b = U.randInt(rng, 2 + Math.round(10 * lv), 9 + Math.round(60 * lv)); ans = a + b; d = (a + b) / 160; }
    else if (op === "-") { a = U.randInt(rng, 10 + Math.round(30 * lv), 20 + Math.round(90 * lv)); b = U.randInt(rng, 2, a - 1); ans = a - b; d = a / 130; }
    else if (op === "×") { a = U.randInt(rng, 2, 5 + Math.round(7 * lv)); b = U.randInt(rng, 2, 9 + Math.round(6 * lv)); ans = a * b; d = 0.2 + ans / 200; }
    else { b = U.randInt(rng, 2, 4 + Math.round(8 * lv)); ans = U.randInt(rng, 2, 9 + Math.round(4 * lv)); a = b * ans; d = 0.3 + a / 220; }
    const cand = [ans + 1, ans - 1, ans + 2, ans - 2, ans + 10, ans - 10];
    if (op === "×") cand.push(ans + a, ans - a, ans + b, ans - b);
    if (op === "÷") cand.push(ans + 3, b, ans * 2);
    const set = [];
    for (const c of U.shuffle(rng, cand)) if (c > 0 && c !== ans && !set.includes(c)) { set.push(c); if (set.length === 3) break; }
    while (set.length < 3) { const c = ans + U.randInt(rng, 3, 19); if (!set.includes(c)) set.push(c); }
    const options = U.shuffle(rng, [ans, ...set]);
    return { text: `${a} ${op === "-" ? "−" : op} ${b}`, ans, options, correct: options.indexOf(ans), d: clamp(d, 0, 1) };
  }
  function rushContent(seed, mode) {
    const rng = U.rng(seed + "|rush");
    const probs = [];
    for (let i = 0; i < 200; i++) probs.push(rushProblem(rng, i));
    return { dur: mode === "mix" ? 25000 : 40000, probs };
  }
  const rushGain = (streak) => 100 + Math.min(50, 10 * (streak - 1)); // streak includes this answer

  /* =====================================================================
     4. DARTS NINE
     ===================================================================== */
  const DB = { BULL: 6.35, OBULL: 15.9, TI: 99, TO: 107, DI: 162, DO: 170, NUM: 196, VIEW: 460,
    ORDER: [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5],
    A0: 50, AMIN: 21, FATIGUE: 1600, SCATTER: 4, CLOCK: 10000, T20: { x: 0, y: 103 } };
  /* board coordinates in mm, origin at bull, y up; 20 at the top */
  function dartScore(x, y) {
    const r = Math.hypot(x, y);
    if (!(r >= 0)) return { pts: 0, label: "Miss" };
    if (r <= DB.BULL) return { pts: 50, label: "Bull" };
    if (r <= DB.OBULL) return { pts: 25, label: "25" };
    if (r > DB.DO) return { pts: 0, label: "Miss" };
    const a = Math.atan2(x, y) * 180 / Math.PI; // clockwise from top
    const idx = Math.floor((((a + 9) % 360) + 360) % 360 / 18) % 20;
    const n = DB.ORDER[idx];
    if (r >= DB.TI && r <= DB.TO) return { pts: 3 * n, label: "T" + n };
    if (r >= DB.DI) return { pts: 2 * n, label: "D" + n };
    return { pts: n, label: String(n) };
  }
  function dartsContent(seed, mode) {
    const rng = U.rng(seed + "|darts");
    const n = mode === "mix" ? 6 : 9;
    const darts = [];
    for (let i = 0; i < n; i++) {
      const mk = () => {
        const f = [], p = [], a = [];
        const base = [1, 0.6, 0.35];
        for (let k = 0; k < 3; k++) { f.push(0.35 + k * 0.3 + rng() * 0.45); p.push(rng() * TAU); a.push(base[k] * (0.8 + rng() * 0.4)); }
        const s = a.reduce((x, y) => x + y, 0);
        return { f, p, a: a.map((v) => v / s) };
      };
      darts.push({ wx: mk(), wy: mk(), sx: U.gauss(rng) * DB.SCATTER, sy: U.gauss(rng) * DB.SCATTER });
    }
    return { n, darts };
  }
  const wob1 = (w, t) => w.a[0] * Math.sin(TAU * w.f[0] * t + w.p[0]) + w.a[1] * Math.sin(TAU * w.f[1] * t + w.p[1]) + w.a[2] * Math.sin(TAU * w.f[2] * t + w.p[2]);
  function dartsAmp(holdMs) { // holdMs < 0 = not holding
    if (holdMs < 0) return DB.A0;
    let A = DB.AMIN + (DB.A0 - DB.AMIN) * Math.exp(-holdMs / 350);
    if (holdMs > DB.FATIGUE) A += (holdMs - DB.FATIGUE) / 1000 * 45;
    return Math.min(A, 80);
  }

    const s = clamp(skill, 0.05, 0.98);
    const P = { s, delay: 0.3 - 0.14 * s, maxV: 480 + 1100 * s, defErr: 13 + 40 * (1 - s), aimErr: 26 + 85 * (1 - s),

  }
  /* human proxies for calibration: 'casual' = ordinary player (quick hand, ~250 ms reaction, loose aim),
     'good' = strong player */
  const HK_HUMAN = { casual: { s: 0.45, delay: 0.25, maxV: 2000, defErr: 36, aimErr: 70, bank: 0.15, power: 55, defDepth: 0.45, passive: 0 },
    good: { s: 0.75, delay: 0.19, maxV: 3000, defErr: 18, aimErr: 35, bank: 0.4, power: 70, defDepth: 0.8, passive: 0 } };
  /* AI controller. Canonical frame: own goal at y=0, own half y < H/2. */
  function hkAI(skill, rng, params) {
    const P = params || hkParams(skill);
    const ai = Object.assign({ rng, err: 0, err2: 0, errT: 0, tgt: null, think: 0, shot: 0 }, P);
    ai.delaySteps = Math.round(ai.delay * HK.HZ);
    const fn = function (w, k) {
      w.pads[k].maxV = ai.maxV;

      ai.think = 3;
      if (ai.errT-- <= 0) {
        ai.err = U.gauss(rng); ai.err2 = U.gauss(rng); ai.errT = 15 + Math.floor(rng() * 20);
        ai.shot = rng() < ai.bank ? (rng() < 0.5 ? -1 : 1) : 0;
        ai.hold = rng() < ai.passive; // passive window: guard the goal instead of attacking
      }
      const N = HK.HIST, j = (((w.hi - 1 - ai.delaySteps) % N) + N) % N * 4;
      const flip = k === 0, H = HK.H;
      const p = { x: w.hist[j], y: flip ? H - w.hist[j + 1] : w.hist[j + 1], vx: w.hist[j + 2], vy: flip ? -w.hist[j + 3] : w.hist[j + 3] };
      const pad = w.pads[k], me = { x: pad.x, y: flip ? H - pad.y : pad.y };

  function hkDecide(w, k, p, me, ai) {

        if (ty < reach * 0.5) return sweep();

      }
      if (align > 0.8 || Math.hypot(ax - me.x, ay - me.y) < 8) return { x: qx + dx * ai.power, y: qy + dy * ai.power };

    }

      let side = me.x >= qx ? 1 : -1;
      const off = reach + 10;
      if (qx + side * off > hi || qx + side * off < lo) side = -side;
      if (Math.abs(me.x - qx) < off) return { x: qx + side * off, y: me.y };

  }
  DG.css("hockey", `
    .g-hockey{display:grid;gap:10px}
    .g-hockey-hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
    .g-hockey-hud .g-hockey-side{display:flex;gap:8px;align-items:baseline;min-width:0}
    .g-hockey-hud .g-hockey-side span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
    .g-hockey-hud .g-hockey-side.r{justify-content:flex-end}
    .g-hockey-hud b{font-family:var(--f-mono);font-size:28px;font-variant-numeric:tabular-nums;line-height:1}
    .g-hockey-clock{font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:4px 10px}
    .g-hockey-stage{line-height:0}
    .g-hockey-stage canvas{border-radius:var(--r-lg);cursor:none}`);

  function hkMount(ctx, names, colors) {
    ctx.root.innerHTML = `<div class="g-hockey">
      <div class="g-hockey-hud"><div class="g-hockey-side"><b style="color:${colors[0]}" data-test="score-0">0</b><span style="color:${colors[0]}">${U.esc(names[0])}</span></div>
        <div class="g-hockey-clock" data-test="clock">2:00</div>
        <div class="g-hockey-side r"><span style="color:${colors[1]}">${U.esc(names[1])}</span><b style="color:${colors[1]}" data-test="score-1">0</b></div></div>
      <div class="g-hockey-stage" data-test="stage"></div>
      <p class="dg-note" data-test="hint"></p></div>`;
    const stage = ctx.root.querySelector("[data-test=stage]");
    const view = canvasView(ctx, stage, (cw) => {
      const land = cw >= 600;
      const lw = land ? HK.H : HK.W, lh = land ? HK.W : HK.H;
      const maxH = Math.max(320, (window.innerHeight || 800) - 170);
      let cssW = cw, cssH = cw * lh / lw;
      if (cssH > maxH) { cssH = maxH; cssW = cssH * lw / lh; }
      return { lw, lh, cssW: Math.round(cssW), cssH: Math.round(cssH), land };
    });
    view.cv.dataset.test = "canvas";
    // physics <-> screen-logical
    view.toPhys = (e, upCss) => {
      const l = view.toLogical(e);
      if (upCss) l.y -= upCss / view.scale; // screen-up offset (touch: keep the paddle visible above the finger)
      return view.meta.land ? { x: l.y, y: HK.H - l.x } : { x: l.x, y: l.y };
    };
    view.physToClient = (x, y) => view.meta.land ? view.toClient(HK.H - y, x) : view.toClient(x, y);
    return view;
  }
  function hkTable(view, K, colors) {
    const { W, H } = HK;
    return (g) => {
      if (view.meta.land) g.transform(0, 1, -1, 0, H, 0);
      g.fillStyle = "#15182c"; g.fillRect(0, 0, W, H);
      g.strokeStyle = K.line; g.lineWidth = 2;
      g.strokeRect(1, 1, W - 2, H - 2);
      g.strokeStyle = "rgba(157,155,192,.35)"; g.lineWidth = 2;
      g.beginPath(); g.moveTo(0, H / 2); g.lineTo(W, H / 2); g.stroke();
      g.beginPath(); g.arc(W / 2, H / 2, 42, 0, TAU); g.stroke();
      g.beginPath(); g.arc(W / 2, 0, 62, 0, Math.PI); g.stroke();
      g.beginPath(); g.arc(W / 2, H, 62, Math.PI, TAU); g.stroke();
      g.lineWidth = 7;
      g.strokeStyle = colors[1]; g.beginPath(); g.moveTo(GL, 2); g.lineTo(GR, 2); g.stroke();
      g.strokeStyle = colors[0]; g.beginPath(); g.moveTo(GL, H - 2); g.lineTo(GR, H - 2); g.stroke();
    };
  }
  function hkDraw(view, w, K, colors, names, extraText) {
    const g = view.g, { H, PR, KR } = HK;
    if (!view.tableFn) view.tableFn = hkTable(view, K, colors);
    view.blit(view.tableFn); // static table from the cached layer
    if (view.meta.land) g.transform(0, 1, -1, 0, H, 0);
    // pads
    for (let k = 0; k < 2; k++) {
      const p = w.pads[k];
      g.fillStyle = colors[k]; g.beginPath(); g.arc(p.x, p.y, PR, 0, TAU); g.fill();
      g.fillStyle = "rgba(0,0,0,.28)"; g.beginPath(); g.arc(p.x, p.y, PR * 0.62, 0, TAU); g.fill();
      g.fillStyle = colors[k]; g.beginPath(); g.arc(p.x, p.y, PR * 0.36, 0, TAU); g.fill();
    }
    // puck
    const P = w.puck;
    g.fillStyle = K.fg; g.beginPath(); g.arc(P.x, P.y, KR, 0, TAU); g.fill();
    g.strokeStyle = "#8f8db0"; g.lineWidth = 2; g.beginPath(); g.arc(P.x, P.y, KR * 0.6, 0, TAU); g.stroke();
    // overlay text in unrotated screen space
    view.reset();
    g.textAlign = "center"; g.textBaseline = "middle";
    const cx = view.lw / 2, cy = view.lh / 2;
    let big = null, small = null;
    if (w.phase === "kick" && w.steps > 2) {
      big = String(Math.max(1, Math.ceil(w.kick / (HK.KICK / 3))));
      small = (w.lastGoal >= 0 ? `Goal ${names[w.lastGoal]}! ` : "") + `${names[w.serve]} serve${w.serve === 0 && names[0] === "You" ? "" : "s"}`;
    }
    if (w.sudden && w.phase !== "over" && !big) small = "Sudden death";
    if (extraText) { big = extraText; small = null; }
    g.lineJoin = "round";
    if (big) {
      g.font = `900 64px ${K.display}`;
      const fitW = view.lw * 0.86, mw = g.measureText(big).width;
      if (mw > fitW) g.font = `900 ${Math.floor(64 * fitW / mw)}px ${K.display}`;
      g.lineWidth = 8; g.strokeStyle = "rgba(0,0,0,.6)";

    if (small) {
      g.font = `700 17px ${K.body}`; g.lineWidth = 5; g.strokeStyle = "rgba(0,0,0,.7)";

  }
  /* HUD writer that touches the DOM only when something changed; returns the clock text on change */
  function hkHud($s0, $s1, $clk) {
    let a = -1, b = -1, sec = -1, sd = null;
    return (w) => {
      const rem = w.sudden ? w.sd - w.sdClock : w.time - w.clock, s2 = Math.max(0, Math.ceil(rem));
      if (w.score[0] === a && w.score[1] === b && s2 === sec && w.sudden === sd) return null;
      if (w.score[0] !== a) $s0.textContent = a = w.score[0];
      if (w.score[1] !== b) $s1.textContent = b = w.score[1];

  function hkClock(w) {

  function hkRun(ctx, w, ctrl, view, onFrame, onOver) {

    };

    const w = hkNew(U.rng(seed + "|hockey")() < 0.5 ? 0 : 1);

    const ctrl = [mk(s0, "|ai0"), mk(s1, "|ai1")];

  }

  DG.registerGame({
    id: "hockey", name: "Air Hockey", category: "reflex", kind: "versus", formats: ["1v1", "tournament"],
    skill: 8, luck: 2, cashEligible: true, duration: "2 min", pack: "reflex",
    blurb: "Real-time air hockey. Guard your goal, bank shots off the walls, first to 5.",
    rules: [
      "Move your gold paddle with the mouse or your finger; it stays in your half.",
      "On touch the paddle sits just above your finger so you can see it.",
      "Hit the puck into the red goal at the far end. Paddle speed adds power.",
      "First to 5 goals wins. After 2 minutes the leader wins.",
      "Level after 2 minutes: 30 s sudden death, then a draw.",
      "Serve alternates after every goal.",
    ],
    scoreLabel: "goals",
    play(ctx) {
      const opp = ctx.opponents[0] || { name: "Rival", skill: 0.5 };
      const K = tokens(ctx.root);
      const names = ["You", opp.name || "Rival"], colors = [K.gold, K.rival];
      const view = hkMount(ctx, names, colors);
      ctx.root.querySelector("[data-test=hint]").textContent = "Move over the table to steer your paddle (on touch it sits just above your finger). Score in the red goal.";
      const w = hkNew(U.rng(ctx.seed + "|hockey")() < 0.5 ? 0 : 1);
      const aiOpp = hkAI(opp.skill != null ? opp.skill : 0.5, U.rng(ctx.seed + "|ai1"));
      let target = { x: w.pads[0].x, y: w.pads[0].y };
      const human = () => target;
      const ctrl = [human, aiOpp];
      const status = statusSetter(ctx);
      const cv = view.cv;
      const TOUCH_UP = 56; // css px
      const move = (e) => { if (ctx.signal.ended) return; target = view.toPhys(e, e.pointerType === "touch" ? TOUCH_UP : 0); };
      cv.addEventListener("pointermove", (e) => { e.preventDefault(); move(e); });
      cv.addEventListener("pointerdown", (e) => { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ } move(e); });
      const $s0 = ctx.root.querySelector("[data-test=score-0]"), $s1 = ctx.root.querySelector("[data-test=score-1]"), $clk = ctx.root.querySelector("[data-test=clock]");
      const hud = hkHud($s0, $s1, $clk);

        if (c) status(`${c} · ${w.score[0]}–${w.score[1]}`);
      };
      const onOver = () => {
        view.stop();
        const [a, b] = w.score;
        const outcome = a > b ? "win" : a < b ? "loss" : "draw";
        hkDraw(view, w, K, colors, names, outcome === "win" ? "YOU WIN" : outcome === "loss" ? "YOU LOSE" : "DRAW");
        const played = w.clock;
        ctx.end({
          outcome, myScore: a, oppScore: b,
          detail: `<p class="dg-note"><b class="dg-gold">You ${a}</b> – <b class="dg-rival">${b} ${U.esc(names[1])}</b> · ${mmss(played)} played${w.sudden ? " · sudden death" : ""}</p>`,
        });
      };
      const run = hkRun(ctx, w, ctrl, view, onFrame, onOver);
      ctx.test = {
        state: () => ({ score: w.score.slice(), clock: w.clock, phase: w.phase, sudden: w.sudden, steps: w.steps, puck: Object.assign({}, w.puck),
          pads: w.pads.map((p) => ({ x: p.x, y: p.y })), escapes: w.escapes, nan: w.nan, land: !!view.meta.land, over: w.over }),
        forceGoal(side) { if (!w.over) hkGoal(w, side === "opp" || side === 1 ? 1 : 0); },
        setClock(sec, sdSec) { if (sec != null) w.clock = sec; if (sdSec != null) { w.sudden = true; w.sdClock = sdSec; } },
        autoplay(skill) { ctrl[0] = hkAI(skill == null ? 0.7 : skill, U.rng(ctx.seed + "|auto")); },
        physToClient: (x, y) => view.physToClient(x, y),
        frames: () => run.frames(),
        stress: (n, seed) => hkStress(n || 10000, seed || 1),
        sim: (seed, s0, s1) => hkSim(seed, s0, s1),
      };
    },
    spectate(ctx) {
      const pl = ctx.players || [{ name: "Left", skill: 0.5 }, { name: "Right", skill: 0.5 }];
      const K = tokens(ctx.root);
      const names = [pl[0].name, pl[1].name], colors = [K.ally, K.rival];
      const view = hkMount(ctx, names, colors);
      ctx.root.querySelector("[data-test=hint]").textContent = `${names[0]} (blue) vs ${names[1]} (red). First to 5.`;
      const w = hkNew(U.rng(ctx.seed + "|hockey")() < 0.5 ? 0 : 1);
      const ctrl = [hkAI(pl[0].skill != null ? pl[0].skill : 0.5, U.rng(ctx.seed + "|ai0")), hkAI(pl[1].skill != null ? pl[1].skill : 0.5, U.rng(ctx.seed + "|ai1"))];
      const status = statusSetter(ctx);
      const $s0 = ctx.root.querySelector("[data-test=score-0]"), $s1 = ctx.root.querySelector("[data-test=score-1]"), $clk = ctx.root.querySelector("[data-test=clock]");
      const hud = hkHud($s0, $s1, $clk);
      const onFrame = () => {
        hkDraw(view, w, K, colors, names);
        const c = hud(w);
        if (c) status(`${c} · ${names[0]} ${w.score[0]}–${w.score[1]} ${names[1]}`);
      };
      const onOver = () => {
        view.stop();
        const [a, b] = w.score;
        const winner = a > b ? 0 : a < b ? 1 : -1;
        hkDraw(view, w, K, colors, names, winner < 0 ? "DRAW" : names[winner].toUpperCase() + " WINS");
        ctx.end({ winner, scores: [a, b] });
      };
      const run = hkRun(ctx, w, ctrl, view, onFrame, onOver);
      ctx.test = {
        state: () => ({ score: w.score.slice(), clock: w.clock, steps: w.steps, goals: w.goals.slice(), escapes: w.escapes, nan: w.nan, over: w.over }),
        frames: () => run.frames(),
      };
    },
  });
})();

<script>/* games/builder.js */
/* Duel.gold — Pack D: BUILDER & BATTLE
   Games: base (Base Duel), city (City Duel), restaurant (Restaurant Duel). All kind 'race'.
   Each game has a pure, DOM-free engine ("lab") shared by play() and bot(); the lab is also exposed on the
   game definition as `_lab` for automated balance tests. */
(function () {
  "use strict";
  const U = DG.util;
  const clamp = U.clamp;
  const FORMATS = ["1v1", "2v2", "ffa", "tournament", "mix"];

  /* ------------------------------------------------------------------ shared helpers */
  function mmss(ms) {
    const s = Math.max(0, Math.ceil(ms / 1000));
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }
  function money(n) {
    const v = Math.round(n);
    return (v < 0 ? "−$" : "$") + Math.abs(v).toLocaleString("en-GB");
  }
  /* A canvas that fills its container width, keeps an aspect ratio and handles devicePixelRatio. */
  function makeCanvas(ctx, host, aspect, draw, maxH) {
    const cv = document.createElement("canvas");
    cv.style.display = "block";
    cv.style.margin = "0 auto";
    cv.style.touchAction = "none";
    host.appendChild(cv);
    const g = cv.getContext("2d");
    const st = { cv, g, w: 0, h: 0, dpr: 1 };
    function fit() {
      let w = Math.max(200, Math.min(860, host.clientWidth || 320));
      const mh = maxH ? maxH() : 1e9;
      if (w / aspect > mh) w = Math.max(200, Math.floor(mh * aspect));
      const h = Math.round(w / aspect);
      cv.style.width = w + "px";
      const dpr = Math.min(3, window.devicePixelRatio || 1);
      if (w === st.w && h === st.h && dpr === st.dpr) return;
      st.w = w; st.h = h; st.dpr = dpr;
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
      cv.style.height = h + "px";
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (!ctx.signal.ended && st.ready) draw();
    }
    fit();
    st.ready = true;
    let ro = null;
    if (window.ResizeObserver) {
      ro = new ResizeObserver(() => { if (ctx.signal.ended) { ro.disconnect(); return; } fit(); });
      ro.observe(host);
    }
    const onWin = () => { if (!ctx.signal.ended) fit(); };
    window.addEventListener("resize", onWin);
    st.fit = fit;
    st.stop = () => { if (ro) ro.disconnect(); ro = null; window.removeEventListener("resize", onWin); };
    if (ctx.onCleanup) ctx.onCleanup(st.stop); else onEndWatch(ctx, st.stop);
    return st;
  }
  /* Watches ctx.signal.ended so observers/listeners die with the match even on abort. */
  function onEndWatch(ctx, fn) {
    const tick = () => { if (ctx.signal.ended) { fn(); return; } setTimeout(tick, 500); };
    setTimeout(tick, 500);
  }

  /* ====================================================================================
     BASE DUEL — engine
     ==================================================================================== */
  const BW = 12, BH = 9;
  const DT = 0.05; // fixed sim step (s)
  const TOWERS = {
    wall:   { name: "Wall",   short: "Wall",   cost: 10, hp: 120, block: true,  desc: "Blocks the path. Zombies walk around it; Brutes smash it." },
    arrow:  { name: "Arrow tower", short: "Arrow", cost: 50, hp: 60, block: true, range: 2.6, dmg: 5, cd: 0.5, desc: "Fast single-target shots (5 dmg). Weak against armoured Brutes. Range 2.6." },
    cannon: { name: "Cannon", short: "Cannon", cost: 90, hp: 80, block: true, range: 2.3, dmg: 22, cd: 1.8, splash: 0.9, desc: "Slow heavy shells (22 dmg) that splash a whole group. Range 2.3." },
    frost:  { name: "Frost tower", short: "Frost", cost: 60, hp: 50, block: true, range: 2.0, dps: 4, slow: 0.45, desc: "Slows every zombie in range to under half speed and chills them. Range 2." },
    spike:  { name: "Spike trap", short: "Spikes", cost: 30, hp: 0, block: false, dps: 12, desc: "Built on the path. Hurts zombies walking over it (12 dmg/s); great under Frost." },
    mine:   { name: "Gold mine", short: "Mine", cost: 60, hp: 40, block: true, income: 1, desc: "Earns 1 gold per second while waves run. Pays off after about 3 waves." },
  };
  const TOWER_ORDER = ["wall", "arrow", "cannon", "frost", "spike", "mine"];
  const ENEMIES = {
    walker:  { name: "Walker",  hp: 30,  spd: 1.3,  dmg: 5,  bounty: 4,  r: 0.22, armor: 1 },
    runner:  { name: "Runner",  hp: 14,  spd: 2.4,  dmg: 3,  bounty: 3,  r: 0.17 },
    brute:   { name: "Brute",   hp: 110, spd: 0.75, dmg: 15, bounty: 12, r: 0.3, wallDps: 30, armor: 4 },
    spitter: { name: "Spitter", hp: 40,  spd: 1.0,  dmg: 6,  bounty: 8,  r: 0.22, range: 2.4, dps: 8 },
  };
  const ENEMY_ORDER = ["walker", "runner", "brute", "spitter"];
  const BASE_HP = 100;

  function baseConfig(mode) {
    return mode === "mix"
      ? { waves: 3, buildMs: 20000, gold: 260, bombs: 2, windowMs: 2000, scale: 3.2, accelMs: 4500, capS: 36, diffs: [2, 3.5, 5] }
      : { waves: 8, buildMs: 60000, gold: 300, bombs: 3, windowMs: 5000, scale: 2, accelMs: 10000, capS: 90, diffs: [1, 2, 3, 4, 5, 6, 7, 8] };
  }
  /* Playback: sim seconds shown per real ms. Presentation only — the sim itself is tick-based. After accelMs of a
     wave, playback runs 3x faster so long waves never drag (keeps mix under 45 s). */
  function baseSimAt(cfg, realMs) {
    const a = cfg.accelMs;
    return (realMs <= a ? realMs * cfg.scale : a * cfg.scale + (realMs - a) * cfg.scale * 3) / 1000;
  }
  function baseRealFor(cfg, simS) {
    const a = cfg.accelMs, simA = a * cfg.scale / 1000;
    return simS <= simA ? simS * 1000 / cfg.scale : a + (simS - simA) * 1000 / (cfg.scale * 3);
  }

  function baseMap(seed, mode) {
    const rng = U.rng("base-map:" + seed);
    for (let attempt = 0; attempt < 50; attempt++) {
      const grid = new Array(BW * BH).fill(0); // 0 free, 1 rock
      const base = { x: BW - 2, y: U.randInt(rng, 2, BH - 3) };
      const nSpawn = rng() < 0.5 ? 2 : 3;
      const spawns = [];
      const cands = [];
      for (let y = 0; y < BH; y++) cands.push({ x: 0, y });
      for (let x = 1; x <= 4; x++) { cands.push({ x, y: 0 }); cands.push({ x, y: BH - 1 }); }
      const sh = U.shuffle(rng, cands);
      for (const c of sh) {
        if (spawns.length >= nSpawn) break;
        if (spawns.every((s) => Math.abs(s.x - c.x) + Math.abs(s.y - c.y) >= 4)) spawns.push(c);
      }
      const nRock = U.randInt(rng, 7, 11);
      let tries = 0;
      while (tries++ < 200 && grid.reduce((a, b) => a + b, 0) < nRock) {
        const x = U.randInt(rng, 1, BW - 1), y = U.randInt(rng, 0, BH - 1);
        if (Math.abs(x - base.x) + Math.abs(y - base.y) <= 1) continue;
        if (spawns.some((s) => Math.abs(s.x - x) + Math.abs(s.y - y) <= 1)) continue;
        grid[y * BW + x] = 1;
      }
      const map = { seed, grid, base, spawns };
      const f = bfsField(map, (i) => grid[i] === 1);
      if (spawns.every((s) => f[s.y * BW + s.x] < 1e9)) {
        // every free tile must be reachable (no sealed pockets)
        let ok = true;
        for (let i = 0; i < BW * BH; i++) if (!grid[i] && f[i] >= 1e9) { grid[i] = 1; }
        if (ok) return map;
      }
    }
    throw new Error("base map generation failed");
  }

  function bfsField(map, blocked) {
    const N = BW * BH, f = new Float64Array(N).fill(1e9);
    const b = map.base.y * BW + map.base.x;
    f[b] = 0;
    const q = new Int16Array(N);
    let tail = 0; q[tail++] = b;
    const visit = (j, v) => { if (f[j] < 1e9 || blocked(j)) return; f[j] = v; q[tail++] = j; };
    for (let h = 0; h < tail; h++) {
      const i = q[h], x = i % BW, y = (i / BW) | 0, v = f[i] + 1;
      if (x < BW - 1) visit(i + 1, v);
      if (x > 0) visit(i - 1, v);
      if (y < BH - 1) visit(i + BW, v);
      if (y > 0) visit(i - BW, v);
    }
    return f;
  }
  /* Dijkstra for Brutes: walls are passable at extra cost (they smash through). */
  function bruteField(map, structs) {
    const N = BW * BH, f = new Float64Array(N).fill(1e9), done = new Uint8Array(N);
    const b = map.base.y * BW + map.base.x;
    f[b] = 0;
    const relax = (i, j) => {
      if (done[j] || map.grid[j]) return;
      const s = structs[j];
      let c = 1;
      if (s) { if (s.type === "wall") c = 1 + s.hp / ENEMIES.brute.wallDps * ENEMIES.brute.spd; else if (TOWERS[s.type].block) return; }
      if (f[i] + c < f[j]) f[j] = f[i] + c;
    };
    for (;;) {
      let i = -1, best = 1e9;
      for (let k = 0; k < N; k++) if (!done[k] && f[k] < best) { best = f[k]; i = k; }
      if (i < 0) break;
      done[i] = 1;
      const x = i % BW, y = (i / BW) | 0;
      if (x < BW - 1) relax(i, i + 1);
      if (x > 0) relax(i, i - 1);
      if (y < BH - 1) relax(i, i + BW);
      if (y > 0) relax(i, i - BW);
    }
    return f;
  }

  function baseWaves(seed, mode) {
    const cfg = baseConfig(mode);
    const rng = U.rng("base-waves:" + seed + ":" + mode);
    const map = baseMap(seed, mode);
    const waves = [];
    cfg.diffs.forEach((d, wi) => {
      const pts = 8 + d * 4.2;
      const pool = ["walker", "walker", "runner"];
      if (d >= 2) pool.push("runner");
      if (d >= 3) pool.push("brute");
      if (d >= 4) pool.push("spitter", "walker");
      if (d >= 6) pool.push("brute", "spitter");
      const cost = { walker: 1, runner: 0.7, brute: 4, spitter: 2 };
      const list = [];
      let left = pts;
      if (d >= 3) { list.push("brute"); left -= cost.brute; }
      if (d >= 4) { list.push("spitter"); left -= cost.spitter; }
      let guard = 0;
      while (left > 0.6 && guard++ < 100) {
        const t = U.pick(rng, pool);
        if (cost[t] > left + 0.5) continue;
        list.push(t); left -= cost[t];
      }
      const order = U.shuffle(rng, list);
      const hpMul = 1 + 0.08 * (d - 1);
      const gap = mode === "mix" ? 0.4 : 0.65;
      let t = 0;
      const spawns = order.map((type) => {
        const e = { t: Math.round(t / DT), type, spawn: Math.floor(rng() * map.spawns.length), hpMul };
        t += gap * (0.6 + rng() * 0.8) * (type === "brute" ? 1.6 : 1);
        return e;
      });
      waves.push({ d, spawns, counts: ENEMY_ORDER.map((k) => [k, list.filter((x) => x === k).length]).filter((c) => c[1]) });
    });
    return { map, waves, cfg };
  }

  /* The simulation. Owns structures, enemies, gold, base HP. Deterministic given the same calls at the same ticks. */
  function BaseSim(seed, mode) {
    const W = baseWaves(seed, mode);
    const S = {
      seed, mode, map: W.map, waves: W.waves, cfg: W.cfg,
      structs: new Array(BW * BH).fill(null),
      enemies: [], fx: [], gold: W.cfg.gold, kills: 0, baseHp: BASE_HP,
      bombs: W.cfg.bombs, bombCd: 0, wave: 0, survived: 0, inWave: false, tick: 0, waveTick: 0,
      over: false, dead: false, spent: 0, nextId: 1, mineAcc: 0, leaks: 0,
      field: null,
      // presentation only: never read by the rules. stats = damage/kills per source; events = queue for the renderer
      stats: { dmg: {}, kills: {} }, events: [],
      dt: DT, tickScale: 1, // bots may use a coarser step: setStep(0.1)
    };
    S.setStep = function (dt) { S.dt = dt; S.tickScale = dt / DT; };
    const idx = (x, y) => y * BW + x;
    const isBlockedFor = (structs) => (i) => S.map.grid[i] === 1 || (structs[i] && TOWERS[structs[i].type].block);
    function refreshFields() {
      S.list = S.structs.filter(Boolean);
      S.field = bfsField(S.map, isBlockedFor(S.structs));
      S._bf = null;
    }
    Object.defineProperty(S, "bfield", { get() { if (!S._bf) S._bf = S.list.some((q) => q.type === "wall") ? bruteField(S.map, S.structs) : S.field; return S._bf; } });
    refreshFields();

    S.canPlace = function (type, x, y) {
      if (x < 0 || y < 0 || x >= BW || y >= BH) return "Off the map";
      const i = idx(x, y);
      if (S.map.grid[i]) return "Rock";
      if (S.structs[i]) return "Occupied";
      if (x === S.map.base.x && y === S.map.base.y) return "That is your base";
      if (S.map.spawns.some((s) => s.x === x && s.y === y)) return "Spawn point";
      if (TOWERS[type].cost > S.gold) return "Not enough gold";
      if (S.inWave) return "Wait for the wave to end";
      if (type === "spike" && !S.onPath(i)) return "Spikes go on a zombie path";
      if (TOWERS[type].block) {
        const tmp = S.structs.slice(); tmp[i] = { type };
        const f = bfsField(S.map, isBlockedFor(tmp));
        if (!S.map.spawns.every((s) => f[idx(s.x, s.y)] < 1e9)) return "Zombies need a path";
      }
      return "";
    };
    S.place = function (type, x, y) {
      const why = S.canPlace(type, x, y);
      if (why) return why;
      const T = TOWERS[type];
      S.structs[idx(x, y)] = { id: S.nextId++, type, x, y, hp: T.hp, maxHp: T.hp, cd: 0, paid: T.cost, flash: 0 };
      S.gold -= T.cost; S.spent += T.cost;
      refreshFields();
      if (S.onAct) S.onAct("place", [type, x, y]);
      return "";
    };
    S.sell = function (x, y) {
      const i = idx(x, y), s = S.structs[i];
      if (!s) return "Nothing to sell";
      if (S.wave > 0 || S.inWave) return "You can only sell during the build phase";
      S.structs[i] = null; S.gold += s.paid; S.spent -= s.paid;
      refreshFields();
      if (S.onAct) S.onAct("sell", [x, y]);
      return "";
    };
    S.repairCost = (s) => (s && s.hp > 0 && s.maxHp > 0 && s.hp < s.maxHp ? Math.max(1, Math.ceil((1 - s.hp / s.maxHp) * TOWERS[s.type].cost * 0.6)) : 0);
    S.repair = function (x, y) {
      const s = S.structs[idx(x, y)];
      if (!s) return "Tap a damaged structure";
      const c = S.repairCost(s);
      if (!c) return "Not damaged";
      if (c > S.gold) return "Repair costs " + c + " gold";
      S.gold -= c; s.hp = s.maxHp; s.flash = 0.4;
      if (S.onAct) S.onAct("repair", [x, y]);
      return "";
    };
    S.bombRadius = 1.25;
    const BOMB_SRC = { type: "bomb" };
    S.bombDamage = () => 35 + 5 * (S.waves[Math.min(S.wave, S.waves.length - 1)] || { d: 1 }).d;
    S.bomb = function (x, y) {
      if (!S.inWave) return "Firebombs work during waves";
      if (S.bombs <= 0) return "No firebombs left";
      if (S.bombCd > 0) return "Firebomb cooling down";
      S.bombs--; S.bombCd = 5;
      const dmg = S.bombDamage();
      for (const e of S.enemies) if (Math.hypot(e.x - x, e.y - y) <= S.bombRadius + ENEMIES[e.type].r) hurt(e, dmg, true, BOMB_SRC);
      S.fx.push({ k: "bomb", x, y, t: 0.6, r: S.bombRadius });
      if (!S.headless) S.events.push({ k: "bomb", x, y, r: S.bombRadius });
      if (S.onAct) S.onAct("bomb", [x, y]);
      return "";
    };
    S.startWave = function () {
      if (S.inWave || S.over) return false;
      S.inWave = true; S.waveTick = 0; S.spawnIdx = 0;
      return true;
    };
    function hurt(e, d, hit, src) {
      if (e.hp <= 0) return;
      if (hit) d = Math.max(1, d - (ENEMIES[e.type].armor || 0)); // armour blunts single hits (arrows, shells, bombs)
      const k = src && src.type, st = S.stats;
      if (k) { const dealt = Math.min(d, e.hp); st.dmg[k] = (st.dmg[k] || 0) + dealt; src.dmg = (src.dmg || 0) + dealt; }
      e.hp -= d;
      if (e.hp <= 0) {
        S.kills++; S.gold += ENEMIES[e.type].bounty;
        if (k) { st.kills[k] = (st.kills[k] || 0) + 1; src.kills = (src.kills || 0) + 1; }
        if (!S.headless) S.events.push({ k: "die", id: e.id, type: e.type, x: e.x, y: e.y, v: ENEMIES[e.type].bounty });
      }
    }
    function destroy(s) {
      S.structs[idx(s.x, s.y)] = null;
      if (!S.headless) { S.fx.push({ k: "boom", x: s.x + 0.5, y: s.y + 0.5, t: 0.4 }); S.events.push({ k: "destroy", type: s.type, x: s.x + 0.5, y: s.y + 0.5 }); }
      refreshFields();
    }
    function progressOf(e) { return (e.type === "brute" ? S.bfield : S.field)[e.ti] || 0; }
    function nextTile(e) {
      const f = e.type === "brute" ? S.bfield : S.field;
      const i = e.ti, x = i % BW, y = (i / BW) | 0;
      let best = -1, bv = f[i];
      if (x < BW - 1 && f[i + 1] < bv) { bv = f[i + 1]; best = i + 1; }
      if (y < BH - 1 && f[i + BW] < bv) { bv = f[i + BW]; best = i + BW; }
      if (x > 0 && f[i - 1] < bv) { bv = f[i - 1]; best = i - 1; }
      if (y > 0 && f[i - BW] < bv) { bv = f[i - BW]; best = i - BW; }
      return best;
    }
    const d2 = (ax, ay, bx, by) => (ax - bx) * (ax - bx) + (ay - by) * (ay - by);
    S.step = function () {
      const DT = S.dt;
      if (S.over) return;
      S.tick++;
      if (!S.headless) {
        for (const f of S.fx) f.t -= DT;
        if (S.fx.length) S.fx = S.fx.filter((f) => f.t > 0);
        for (const s of S.list) if (s.flash > 0) s.flash -= DT;
      }
      if (!S.inWave) return;
      const wv = S.waves[S.wave];
      if (S.bombCd > 0) S.bombCd = Math.max(0, S.bombCd - DT);
      // spawns
      while (S.spawnIdx < wv.spawns.length && wv.spawns[S.spawnIdx].t <= S.waveTick * S.tickScale + 1e-9) {
        const sp = wv.spawns[S.spawnIdx++], E = ENEMIES[sp.type], p = S.map.spawns[sp.spawn];
        const hp = Math.round(E.hp * sp.hpMul);
        S.enemies.push({ id: S.nextId++, type: sp.type, x: p.x + 0.5, y: p.y + 0.5, ti: idx(p.x, p.y), to: -1, hp, maxHp: hp, slow: 1, busy: 0 });
      }
      S.waveTick++;
      // mines
      for (const s of S.list) if (s.type === "mine" && s.hp > 0) S.mineAcc += TOWERS.mine.income * DT;
      if (S.mineAcc >= 1) { const g = Math.floor(S.mineAcc); S.gold += g; S.mineAcc -= g; }
      // frost aura + spikes
      for (const e of S.enemies) e.slow = 1;
      for (const s of S.list) {
        if (s.type === "frost") {
          const cx = s.x + 0.5, cy = s.y + 0.5, R2 = TOWERS.frost.range * TOWERS.frost.range;
          for (const e of S.enemies) if (e.hp > 0 && d2(e.x, e.y, cx, cy) <= R2) { e.slow = TOWERS.frost.slow; hurt(e, TOWERS.frost.dps * DT, false, s); }
        } else if (s.type === "spike") {
          for (const e of S.enemies) if (e.hp > 0 && Math.floor(e.x) === s.x && Math.floor(e.y) === s.y) hurt(e, TOWERS.spike.dps * DT, false, s);
        }
      }
      // towers fire
      for (const s of S.list) {
        if (s.hp <= 0 || (s.type !== "arrow" && s.type !== "cannon")) continue;
        if (s.cd > 0) s.cd -= DT;
        if (s.cd > 1e-9) continue;
        const T = TOWERS[s.type], cx = s.x + 0.5, cy = s.y + 0.5, R2 = T.range * T.range;
        let tgt = null, tp = 1e9;
        for (const e of S.enemies) {
          if (e.hp <= 0 || d2(e.x, e.y, cx, cy) > R2) continue;
          const p = progressOf(e);
          if (p < tp || (p === tp && e.id < tgt.id)) { tp = p; tgt = e; }
        }
        if (!tgt) continue;
        s.cd += T.cd;
        if (!S.headless) { s.aim = Math.atan2(tgt.y - cy, tgt.x - cx); s.shot = S.tick; }
        if (s.type === "arrow") { hurt(tgt, T.dmg, true, s); if (!S.headless) S.fx.push({ k: "shot", x: cx, y: cy, x2: tgt.x, y2: tgt.y, t: 0.12 }); }
        else {
          const tx0 = tgt.x, ty0 = tgt.y, SP2 = T.splash * T.splash;
          for (const e of S.enemies) if (e.hp > 0 && d2(e.x, e.y, tx0, ty0) <= SP2) hurt(e, T.dmg, true, s);
          if (!S.headless) { S.fx.push({ k: "splash", x: tgt.x, y: tgt.y, t: 0.3, r: T.splash, x0: cx, y0: cy }); S.events.push({ k: "blast", x: tx0, y: ty0, r: T.splash }); }
        }
      }
      // enemies act
      for (const e of S.enemies) {
        if (e.hp <= 0) continue;
        const E = ENEMIES[e.type];
        if (e.type === "spitter") {
          let tgt = null, td = 1e9;
          for (const s of S.list) {
            if (s.hp <= 0 || s.type === "wall" || s.type === "spike") continue;
            const d = d2(s.x + 0.5, s.y + 0.5, e.x, e.y);
            if (d <= E.range * E.range && (d < td || (d === td && s.id < tgt.id))) { td = d; tgt = s; }
          }
          if (tgt) {
            tgt.hp -= E.dps * DT; tgt.flash = 0.1;
            if (!S.headless && S.tick % 8 === 0) S.fx.push({ k: "spit", x: e.x, y: e.y, x2: tgt.x + 0.5, y2: tgt.y + 0.5, t: 0.2 });
            if (tgt.hp <= 0) destroy(tgt);
            continue;
          }
        }
        if (e.to < 0) {

      if (sel && (sel.hp <= 0 && sel.type !== "spike" || S.structs[S.idx(sel.x, sel.y)] !== sel)) sel = null;
      if (sel) {
        const s = sel, T = TOWERS[s.type], rc = S.repairCost(s), canSell = !(S.wave > 0 || S.inWave), f = s.maxHp ? s.hp / s.maxHp : 1;
        key = ["sel", s.id, Math.ceil(s.hp), s.kills || 0, Math.round((s.dmg || 0) / 5), rc, rc && rc <= S.gold, canSell].join(":");
        if (key !== infoKey) {
          const stats = s.type === "mine" ? `<span>Income <b>+${T.income}g/s</b></span><span>During waves</span>`
            : s.type === "wall" ? `<span>Blocks and reroutes</span>` : `<span>Kills <b>${s.kills || 0}</b></span><span>Damage <b>${U.fmt(Math.round(s.dmg || 0))}</b></span>`;
          html = `<div class="${P}-insp"><img src="${towerIcon(s.type)}" alt=""><div><b>${T.name}</b>${chips([s.maxHp ? Math.ceil(s.hp) + " / " + s.maxHp + " HP" : "trap", T.range ? "range " + T.range : ""])}</div></div>` +
            (s.maxHp ? `<div class="${P}-ihp"><i style="width:${(f * 100).toFixed(1)}%;background:${f > 0.45 ? "var(--good)" : "var(--bad)"}"></i></div>` : "") +
            `<div class="${P}-ist">${stats}</div>` +
            `<div class="${P}-iact"><button class="dg-btn" data-act="repair"${rc && rc <= S.gold ? "" : " disabled"}>${rc ? "Repair · " + rc + "g" : "Repair"}</button>` +
            `<button class="dg-btn" data-act="sell"${canSell ? "" : " disabled"}>Sell · +${s.paid}g</button></div>`;
        }
      } else {
        key = "tool:" + tool + ":" + (tool === "bomb" ? S.bombDamage() : "");
        if (key !== infoKey) html = toolInfo(tool);
      }
      if (key !== infoKey) { infoKey = key; $("info").innerHTML = html; }
    }
    $("info").addEventListener("click", (e) => {
      const b = e.target.closest("[data-act]");
      if (!b || !sel || phase === "done") return;
      const x = sel.x, y = sel.y;
      if (b.dataset.act === "repair") { const why = S.repair(x, y); say(why || "Repaired.", why ? "bad" : "good"); SFX.play(why ? "err" : "place"); }
      else { const why = S.sell(x, y); say(why || "Sold for a full refund.", why ? "bad" : "good"); SFX.play(why ? "err" : "sell"); if (!why) sel = null; }
      infoKey = ""; renderInfo();
    });

    // ---- HUD
    const hudCache = {};
    function setT(t, v) { if (hudCache[t] !== v) { hudCache[t] = v; const el = $(t); if (el) el.textContent = v; } }
    function bump(k) { const el = ctx.root.querySelector(`[data-k="${k}"]`); if (el) { el.classList.remove("gain"); void el.offsetWidth; el.classList.add("gain"); } }
    function setTool(t) {
      if (phase === "done") return;
      tool = t; pending = null; sel = null;
      if (TOWERS[t]) lastTower = t;
      ctx.root.querySelectorAll("[data-tool]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.tool === t)));
      renderInfo();
    }
    function setSound() {
      const b = $("sfx");
      b.setAttribute("aria-pressed", String(SFX.on));
      b.setAttribute("aria-label", SFX.on ? "Sound on" : "Sound off");
      b.innerHTML = SFX.on ? HUD_ICON.sndOn : HUD_ICON.sndOff;
    }
    const seenBefore = (wi) => { const o = new Set(); for (let i = 0; i < wi; i++) for (const [k] of S.waves[i].counts) o.add(k); return o; };
    function hud() {
      setT("wave", Math.min(S.wave + (phase === "wave" ? 1 : 0), cfg.waves) + "/" + cfg.waves);
      setT("hp", String(Math.ceil(S.baseHp)));
      const gOld = hudCache.gold, kOld = hudCache.kills;
      setT("gold", String(S.gold));
      setT("kills", String(S.kills));
      if (gOld != null && Number(gOld) < S.gold && phase === "wave") bump("gold");
      if (kOld != null && kOld !== hudCache.kills) bump("kills");
      const hf = Math.max(0, S.baseHp) / BASE_HP, hb = $("hpbar");
      const hpw = (hf * 100).toFixed(1) + "%";
      if (hudCache.hpw !== hpw) { hudCache.hpw = hpw; hb.style.width = hpw; hb.style.backgroundColor = hf > 0.5 ? "var(--good)" : hf > 0.25 ? "#FFB35C" : "var(--bad)"; }
      setT("score", phase === "build" ? "0" : U.fmt(S.score())); // nothing is scored until the defence starts
      setT("bombs", S.bombCd > 0 && phase === "wave" ? `cool ${Math.ceil(S.bombCd)}s` : `${S.bombs} left`);
      const goTxt = phase === "build" ? "Start waves" : phase === "window" ? "Next wave now" : phase === "wave" ? "Wave running" : "Finished";
      const go = $("go");
      if (go.textContent !== goTxt) { go.textContent = goTxt; go.disabled = phase === "wave" || phase === "done"; }
      const wv = S.waves[S.wave];
      let ph, frac = 0;
      if (phase === "build") { ph = `Build your defence · ${cfg.gold} gold budget`; frac = Math.max(0, 1 - ctx.now() / cfg.buildMs); }
      else if (phase === "window") { ph = `Wave ${S.wave} held · build, repair, or start the next wave`; frac = Math.max(0, 1 - (ctx.now() - phaseStart) / cfg.windowMs); }
      else if (phase === "wave" && wv) {
        const left = wv.spawns.length - S.spawnIdx + S.enemies.length;
        ph = `Wave ${S.wave + 1} of ${cfg.waves} · ${left} zombie${left === 1 ? "" : "s"} left`;
        frac = 1 - left / Math.max(1, wv.spawns.length);
      } else { ph = "Defence over"; frac = 1; }
      setT("phase", ph);
      const wp = $("wprog"), wpw = (frac * 100).toFixed(1) + "%";
      if (hudCache.wpw !== wpw) { hudCache.wpw = wpw; wp.firstChild.style.width = wpw; }
      const wpc = phase === "wave" ? "wave" : "";
      if (hudCache.wpc !== wpc) { hudCache.wpc = wpc; wp.className = `${P}-wp ${wpc}`; }
      const pv = !wv || phase === "done" ? "" : wv.counts.map(([k, c]) => `<span title="${ENEMIES[k].name}: ${U.esc(ENEMY_DESC[k])}"><img src="${zombieIcon(k)}" alt="">${ENEMIES[k].name} <b>×${c}</b></span>`).join("");
      if (hudCache.prev !== pv) {
        hudCache.prev = pv; $("preview").innerHTML = pv || '<span class="dg-muted">No more waves</span>';
        let tip = "";
        if (wv && phase !== "done") {
          const old = seenBefore(S.wave), fresh = wv.counts.map(([k]) => k).filter((k) => !old.has(k) && ENEMY_TIP[k]);
          if (fresh.length && S.wave > 0) tip = `<b style="color:var(--fg)">New:</b> ${ENEMY_TIP[fresh[0]]}`;
          else if (S.wave === 0) tip = "Walls make the route longer, so zombies walk past more towers. Spikes under Frost hit hardest.";
          else if (S.wave === cfg.waves - 1) tip = "Final wave. Spend your gold: unspent gold scores only ÷ 10.";
        }
        $("tip").innerHTML = tip;
      }
      setT("prev-title", phase === "done" ? "Waves" : phase === "wave" ? `This wave (${S.wave + 1})` : `Next wave (${Math.min(S.wave + 1, cfg.waves)} of ${cfg.waves})`);
      ctx.root.querySelectorAll("[data-tool]").forEach((b) => {
        const T = TOWERS[b.dataset.tool];
        b.classList.toggle("poor", !!T && T.cost > S.gold);
        if (b.dataset.tool === "bomb") b.classList.toggle("live", phase === "wave" && S.bombs > 0 && S.bombCd <= 0);
      });
      renderInfo();
    }
    // ---- flow
    function startWave() {
      if (phase === "done" || phase === "wave" || S.over) return;
      phase = "wave"; pending = null;
      waveKills0 = S.kills; waveLeaks0 = S.leaks;
      const wv = S.waves[S.wave], old = seenBefore(S.wave), fresh = wv.counts.map(([k]) => k).filter((k) => !old.has(k));
      S.startWave(); waveStart = ctx.now();
      if (S.bombs > 0) setTool("bomb");
      const last = S.wave === cfg.waves - 1;
      showBanner(last ? "FINAL WAVE" : "WAVE " + (S.wave + 1), fresh.length && S.wave > 0 ? "New: " + fresh.map((k) => ENEMIES[k].name + "s").join(" & ") + "!"
        : wv.counts.map(([k, c]) => c + " " + ENEMIES[k].name + (c === 1 ? "" : "s")).join(" · "), last ? C.bad : "#FF8A9A", 1.4);
      SFX.play("wave");
      say("Wave " + (S.wave + 1) + " incoming.", "");
    }
    function waveOver() {
      S.fx = [];
      ctx.progress(S.score());
      if (S.over) { finish(); return; }
      phase = "window"; phaseStart = ctx.now();
      setTool(lastTower);
      const kills = S.kills - waveKills0, leaks = S.leaks - waveLeaks0;
      showBanner(`WAVE ${S.wave} HELD`, `${kills} zombie${kills === 1 ? "" : "s"} down · ${leaks ? leaks + " got through" : "no leaks"}`, C.gold, 1.3);
      SFX.play("held");
      say(`Wave ${S.wave} held. +${cfg.windowMs / 1000} s to build or repair.`, "good");
    }
    const SRC_NAME = { bomb: "Firebomb" };
    function damageBreakdown() {
      const rows = Object.keys(S.stats.dmg).map((k) => [k, S.stats.dmg[k], S.stats.kills[k] || 0]).filter((r) => r[1] >= 1).sort((a, b) => b[1] - a[1]);
      if (!rows.length) return "";
      const max = rows[0][1];
      return `<div class="dg-eyebrow">Damage by source</div><div class="${P}-dmg">${rows.map(([k, d, kl]) =>
        `<div class="r"><span><img src="${towerIcon(k)}" alt="">${SRC_NAME[k] || TOWERS[k].name}</span><i><em style="width:${Math.max(2, (d / max) * 100).toFixed(1)}%;background:${TCOL[k]}"></em></i><b>${U.fmt(Math.round(d))} <small>· ${kl} kills</small></b></div>`).join("")}</div>`;
    }
    function finish() {
      if (phase === "done") return;
      phase = "done"; hover = null; pending = null; sel = null;
      const score = S.score();
      const rows = [
        ["Waves survived", `${S.survived} × 1,000`, 1000 * S.survived],
        ["Base HP left", `${Math.max(0, Math.round(S.baseHp))} × 5`, Math.max(0, Math.round(S.baseHp)) * 5],
        ["Kills", `${S.kills} × 10`, 10 * S.kills],
        ["Unspent gold", `${S.gold} ÷ 10`, Math.floor(S.gold / 10)],
      ];
      const table = `<table class="dg-table"><tbody>${rows.map((r) => `<tr><td>${r[0]}</td><td class="num dg-muted">${r[1]}</td><td class="num">${U.fmt(r[2])}</td></tr>`).join("")}
        <tr class="tot"><td>Total</td><td></td><td class="num dg-gold">${U.fmt(score)}</td></tr></tbody></table>`;
      const verdict = S.dead ? `Base destroyed in wave ${S.wave + 1}.` : `All ${cfg.waves} waves held.`;
      let mvp = null;
      for (const s of S.list) everBuilt.set(s.id, s);
      for (const s of everBuilt.values()) if ((s.kills || 0) > 0 && (!mvp || s.kills > mvp.kills)) mvp = s;
      const lost = mvp && S.structs[S.idx(mvp.x, mvp.y)] !== mvp ? " before it fell" : "";
      const mvpLine = mvp ? `<div class="${P}-mvp">Top defender: <b>${TOWERS[mvp.type].name}</b> with ${mvp.kills} kills and ${U.fmt(Math.round(mvp.dmg || 0))} damage${lost}.</div>` : "";
      $("result").innerHTML = `<div class="${P}-res"><div class="dg-eyebrow">Base Duel · final</div>
        <div class="${P}-big" data-test="final">${U.fmt(score)}<small>points · ${verdict}</small></div>${table}${mvpLine}${damageBreakdown()}</div>`;
      ctx.root.querySelectorAll("[data-tool]").forEach((b) => { b.disabled = true; b.setAttribute("aria-pressed", "false"); });
      showBanner(S.dead ? "BASE OVERRUN" : "BASE HELD", `${U.fmt(score)} points`, S.dead ? C.bad : C.gold, 2.6);
      SFX.play(S.dead ? "end" : "held");
      say(verdict, S.dead ? "bad" : "good");
      infoKey = ""; hud(); draw();

    }
    function frame(now) {
      if (ctx.signal.ended) return;
      if (phase === "wave") {
        const target = Math.round(baseSimAt(cfg, now - waveStart) / DT);
        let n = 0;

      }

    function act(e) {
      if (phase === "done" || ctx.signal.ended) return;
      const p = tileAt(e);
      if (!p) return;
      hover = p;
      if (tool === "bomb") {
        const why = S.bomb(p.fx, p.fy);
        say(why || "Firebomb away.", why ? "bad" : "good");
        if (why) SFX.play("err");
        if (!why && S.bombs === 0) setTool("repair");
        return;
      }
      const s = S.structs[S.idx(p.x, p.y)];
      if (tool === "repair") { const why = S.repair(p.x, p.y); say(why || "Repaired.", why ? "bad" : "good"); SFX.play(why ? "err" : "place"); return; }
      if (tool === "sell") { const why = S.sell(p.x, p.y); say(why || "Sold for a full refund.", why ? "bad" : "good"); SFX.play(why ? "err" : "sell"); return; }
      if (s) {
        sel = sel === s ? null : s; pending = null; infoKey = "";
        say(sel ? `${TOWERS[s.type].name}: ${Math.ceil(s.hp)}/${s.maxHp} HP. Repair or sell it from the panel.` : "", "");

        return;
      }
      if (sel) { sel = null; infoKey = ""; }

      const T = TOWERS[tool];
      if (e.pointerType && e.pointerType !== "mouse" && T.cost >= 50 && !(pending && pending.x === p.x && pending.y === p.y && pending.t === tool)) {

    ctx.root.querySelectorAll("[data-tool]").forEach((b) => b.addEventListener("click", () => setTool(b.dataset.tool)));

    $("sfx").addEventListener("click", () => { SFX.arm(); SFX.set(!SFX.on); setSound(); });
    ctx.onKey((e) => {

    });
    ctx.interval(() => {
      const now = ctx.now();
      if (phase === "build") {
        const left = cfg.buildMs - now;
        ctx.setStatus("Build · " + mmss(left));
        if (left <= 0) startWave();
      } else if (phase === "window") {
        const left = cfg.windowMs - (now - phaseStart);
        ctx.setStatus(`Wave ${S.wave + 1} in ${Math.max(0, Math.ceil(left / 1000))} s`);
        if (left <= 0) startWave();
      } else if (phase === "wave") ctx.setStatus(`Wave ${S.wave + 1}/${cfg.waves}`);
    }, 200);
    setTool("arrow");
    setSound();
    say(ctx.mode === "mix" ? "Quick defence: 20 s to build, then 3 waves." : "Build towers on the grid. Walls and towers reroute the zombies (dashed lines).", "");
    ctx.setStatus("Build · " + mmss(cfg.buildMs));
    hud();
    ctx.raf(frame);

    ctx.test = {
      state: () => ({ phase, gold: S.gold, wave: S.wave, survived: S.survived, baseHp: S.baseHp, kills: S.kills, bombs: S.bombs, score: S.score(), over: S.over,
        structs: S.list.map((s) => ({ type: s.type, x: s.x, y: s.y, hp: s.hp })), enemies: S.enemies.map((e) => ({ type: e.type, x: e.x, y: e.y })), log: log.slice(), tool }),

  }
  function BASE_RULES(mode) {
